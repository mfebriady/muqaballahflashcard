<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muqabalah Master Flashcards</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a5f7a;
            --secondary: #159895;
            --accent: #54bab9;
            --bg: #f0f2f5;
            --card-white: #ffffff;
            --text-dark: #2c3333;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            max-width: 800px;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .controls-panel {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 700px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #7f8c8d;
        }

        select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: border 0.3s;
        }

        select:focus {
            border-color: var(--secondary);
        }

        .card-container {
            width: 95%;
            max-width: 600px;
            height: 380px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 20px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            background: var(--card-white);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .card-front {
            border-bottom: 10px solid var(--primary);
        }

        .card-back {
            transform: rotateY(180deg);
            border-bottom: 10px solid var(--secondary);
            background-color: #f8ffff;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 26px;
            font-weight: 700;
            direction: rtl;
            margin-bottom: 20px;
            line-height: 1.5;
            color: #1a1a1a;
        }

        .translation-text {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            background-color: var(--primary);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--secondary);
            transform: translateY(-2px);
        }

        button.btn-random {
            background-color: #f39c12;
        }

        .progress-indicator {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            color: #7f8c8d;
            text-align: center;
        }

        .tag {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 10px;
            padding: 4px 10px;
            background: #eee;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .card-container { height: 450px; }
            .arabic-text { font-size: 22px; }
            .translation-text { font-size: 14px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Muqabalah Master Flashcards</h1>
        <p>Interactive preparation platform for the Islamic University of Madinah interviews.</p>
    </header>

    <div class="controls-panel">
        <div class="control-group">
            <label>Select Question Set</label>
            <select id="setSelect" onchange="changeSet()">
            </select>
        </div>
        <div class="control-group">
            <label>Translation Language</label>
            <select id="langSelect" onchange="renderCard()">
                <option value="en">English Translation</option>
                <option value="id">Bahasa Indonesia</option>
            </select>
        </div>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="flashcard">
            <div class="card-face card-front">
                <span class="tag" id="tag-front">Question</span>
                <div class="arabic-text" id="front-arabic"></div>
                <div class="translation-text" id="front-trans"></div>
            </div>
            <div class="card-face card-back">
                <span class="tag" id="tag-back">Answer</span>
                <div class="arabic-text" id="back-arabic"></div>
                <div class="translation-text" id="back-trans"></div>
            </div>
        </div>
    </div>

    <div class="progress-indicator" id="progressText">Card 1 / 25</div>

    <div class="nav-buttons">
        <button onclick="prevCard(event)">Previous</button>
        <button class="btn-random" onclick="shuffleCard(event)">Shuffle</button>
        <button onclick="nextCard(event)">Next</button>
    </div>

    <script>
        const allData = {"Set 1: Introduction & Administration": [{"front": {"ar": "\u0645\u0627 \u0631\u0642\u0645 \u062a\u0633\u062c\u064a\u0644\u0643\u061f", "id": "Berapa nomor pendaftaranmu?", "en": "What is your registration number?"}, "back": {"ar": "\u0631\u0642\u0645 \u062a\u0633\u062c\u064a\u0644\u064a \u0647\u0648...", "id": "Sebutkan angka Arab satu-per-satu.", "en": "State the numbers one by one in Arabic."}}, {"front": {"ar": "\u0639\u0631\u0641 \u0628\u0646\u0641\u0633\u0643 \u0628\u0627\u0644\u062a\u0641\u0635\u064a\u0644!", "id": "Perkenalkan dirimu secara rinci!", "en": "Introduce yourself in detail!"}, "back": {"ar": "\u0627\u0633\u0645\u064a... \u0648\u0644\u062f\u062a \u0641\u064a... \u0639\u0645\u0631\u064a... \u062a\u062e\u0631\u062c\u062a \u0645\u0646...", "id": "Sebutkan nama, tempat lahir, umur, dan asal sekolah.", "en": "State name, birth place, age, and school background."}}, {"front": {"ar": "\u0645\u0646 \u0623\u064a \u0645\u062f\u064a\u0646\u0629 \u0623\u0646\u062a\u061f", "id": "Dari kota mana kamu berasal?", "en": "Which city are you from?"}, "back": {"ar": "\u0623\u0646\u0627 \u0645\u0646 \u0645\u062f\u064a\u0646\u0629... \u0641\u064a \u0645\u0642\u0627\u0637\u0639\u0629...", "id": "Sebutkan kota dan provinsi.", "en": "State city and province."}}, {"front": {"ar": "\u0643\u0645 \u062c\u0632\u0621\u0627 \u062d\u0641\u0638\u062a \u0645\u0646 \u0627\u0644\u0642\u0631\u0622\u0646\u061f", "id": "Berapa juz Al-Qur'an yang kamu hafal?", "en": "How many Juz of the Quran have you memorized?"}, "back": {"ar": "\u062d\u0641\u0638\u062a... \u0623\u062c\u0632\u0627\u0621 \u0648\u0644\u0644\u0647 \u0627\u0644\u062d\u0645\u062f.", "id": "Sebutkan jumlah juz dengan benar.", "en": "State the number of Juz correctly."}}, {"front": {"ar": "\u0645\u0627 \u0647\u0648 \u0645\u0633\u062a\u0648\u0627\u0643 \u0641\u064a \u0627\u0644\u0644\u063a\u0629 \u0627\u0644\u0639\u0631\u0628\u064a\u0629\u061f", "id": "Bagaimana level Bahasa Arabmu?", "en": "What is your Arabic language level?"}, "back": {"ar": "\u0623\u0646\u0627 \u0637\u0627\u0644\u0628 \u0645\u0628\u062a\u062f\u0626 / \u0645\u062a\u0648\u0633\u0637 \u0648\u0623\u0633\u0639\u0649 \u0644\u0644\u062a\u0637\u0648\u064a\u0631.", "id": "Saya pemula / menengah dan ingin berkembang.", "en": "I am a beginner / intermediate and seek to improve."}}, {"front": {"ar": "\u0623\u064a\u0646 \u062a\u0639\u0644\u0645\u062a \u0627\u0644\u0644\u063a\u0629 \u0627\u0644\u0639\u0631\u0628\u064a\u0629\u061f", "id": "Di mana kamu belajar Bahasa Arab?", "en": "Where did you learn Arabic?"}, "back": {"ar": "\u062a\u0639\u0644\u0645\u062a \u0641\u064a \u0645\u0639\u0647\u062f... \u0641\u064a \u0645\u062f\u064a\u0646\u0629...", "id": "Sebutkan nama pesantren/lembaga.", "en": "State the name of the institute/school."}}, {"front": {"ar": "\u0645\u0646 \u0647\u0648 \u0645\u062f\u064a\u0631 \u0645\u062f\u0631\u0633\u062a\u0643\u061f", "id": "Siapa kepala sekolahmu?", "en": "Who is your school principal?"}, "back": {"ar": "\u0645\u062f\u064a\u0631 \u0645\u062f\u0631\u0633\u062a\u064a \u0647\u0648 \u0627\u0644\u0623\u0633\u062a\u0627\u0630...", "id": "Sebutkan nama lengkap kepala sekolah.", "en": "State the full name of the principal."}}, {"front": {"ar": "\u0645\u062a\u0649 \u062a\u062e\u0631\u062c\u062a \u0645\u0646 \u0627\u0644\u0645\u062f\u0631\u0633\u0629\u061f", "id": "Kapan kamu lulus sekolah?", "en": "When did you graduate from school?"}, "back": {"ar": "\u062a\u062e\u0631\u062c\u062a \u0641\u064a \u0633\u0646\u0629... \u0645\u064a\u0644\u0627\u062f\u064a\u0629.", "id": "Sebutkan tahun kelulusan masehi.", "en": "State the graduation year (AD)."}}, {"front": {"ar": "\u0647\u0644 \u0647\u0630\u0647 \u0623\u0648\u0644 \u0645\u0631\u0629 \u062a\u0642\u062f\u0645 \u0641\u064a\u0647\u0627\u061f", "id": "Apakah ini pertama kali kamu mendaftar?", "en": "Is this your first time applying?"}, "back": {"ar": "\u0646\u0639\u0645\u060c \u0647\u0630\u0647 \u0647\u064a \u0627\u0644\u0645\u0631\u0629 \u0627\u0644\u0623\u0648\u0644\u0649. / \u0644\u0627\u060c \u062a\u0642\u062f\u0645\u062a \u0645\u0646 \u0642\u0628\u0644.", "id": "Ya, pertama kali. / Tidak, sebelumnya sudah.", "en": "Yes, first time. / No, I applied before."}}, {"front": {"ar": "\u0645\u0627 \u0647\u0648 \u062a\u062e\u0635\u0635\u0643 \u0641\u064a \u0627\u0644\u062b\u0627\u0646\u0648\u064a\u0629\u061f", "id": "Apa jurusanmu saat SMA?", "en": "What was your major in high school?"}, "back": {"ar": "\u062a\u062e\u0635\u0635\u064a \u0643\u0627\u0646 \u0627\u0644\u0639\u0644\u0648\u0645 \u0627\u0644\u0634\u0631\u0639\u064a\u0629 / \u0627\u0644\u0639\u0644\u0648\u0645 \u0627\u0644\u0637\u0628\u064a\u0639\u064a\u0629.", "id": "Jurusan Keagamaan / IPA.", "en": "Religious Sciences / Natural Sciences."}}, {"front": {"ar": "\u0647\u0644 \u0648\u0627\u0644\u062f\u0643 \u064a\u0648\u0627\u0641\u0642 \u0639\u0644\u0649 \u0633\u0641\u0631\u0643\u061f", "id": "Apakah ayahmu setuju kamu pergi?", "en": "Does your father agree with your travel?"}, "back": {"ar": "\u0646\u0639\u0645\u060c \u0648\u0627\u0644\u062f\u064a \u064a\u0634\u062c\u0639\u0646\u064a \u062c\u062f\u0627 \u0639\u0644\u0649 \u0637\u0644\u0628 \u0627\u0644\u0639\u0644\u0645.", "id": "Ya, ayah saya sangat mendukung.", "en": "Yes, my father encourages me to seek knowledge."}}, {"front": {"ar": "\u0645\u0627 \u0645\u0647\u0646\u0629 \u0648\u0627\u0644\u062f\u0643\uff1f", "id": "Apa pekerjaan ayahmu?", "en": "What is your father's occupation?"}, "back": {"ar": "\u0648\u0627\u0644\u062f\u064a \u064a\u0639\u0645\u0644... (\u062a\u0627\u062c\u0631 / \u0641\u0644\u0627\u062d / \u0645\u062f\u0631\u0633).", "id": "Ayah saya bekerja sebagai...", "en": "My father works as a..."}}, {"front": {"ar": "\u0647\u0644 \u0639\u0646\u062f\u0643 \u0625\u062e\u0648\u0629 \u064a\u062f\u0631\u0633\u0648\u0646 \u0647\u0646\u0627\u061f", "id": "Apakah kamu punya saudara yang belajar di sini?", "en": "Do you have siblings studying here?"}, "back": {"ar": "\u0646\u0639\u0645\u06         let currentSetName = Object.keys(allData)[0];
        let currentSet = allData[currentSetName];
        let currentIndex = 0;

        const setSelect = document.getElementById('setSelect');
        const langSelect = document.getElementById('langSelect');
        const card = document.getElementById('flashcard');

        // Initialize Select Options
        Object.keys(allData).forEach(name => {
            let opt = document.createElement('option');
            opt.value = name;
            opt.innerText = name;
            setSelect.appendChild(opt);
        });

        function renderCard() {
            card.classList.remove('flipped');
            const lang = langSelect.value;
            const item = currentSet[currentIndex];

            // Update layout tags dynamically
            document.getElementById('tag-front').innerText = (lang === 'id' ? 'Pertanyaan' : 'Question');
            document.getElementById('tag-back').innerText = (lang === 'id' ? 'Contoh Jawaban' : 'Answer Guide');

            setTimeout(() => {
                document.getElementById('front-arabic').innerText = item.front.ar;
                document.getElementById('front-trans').innerText = item.front[lang];
                document.getElementById('back-arabic').innerText = item.back.ar;
                document.getElementById('back-trans').innerText = item.back[lang];
                document.getElementById('progressText').innerText = `Card ${currentIndex + 1} / ${currentSet.length}\n(${currentSetName})`;
            }, 100);
        }

        function flipCard() {
            card.classList.toggle('flipped');
        }

        function changeSet() {
            currentSetName = setSelect.value;
            currentSet = allData[currentSetName];
            currentIndex = 0;
            renderCard();
        }

        function nextCard(e) {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % currentSet.length;
            renderCard();
        }

        function prevCard(e) {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + currentSet.length) % currentSet.length;
            renderCard();
        }

        function shuffleCard(e) {
            e.stopPropagation();
            currentIndex = Math.floor(Math.random() * currentSet.length);
            renderCard();
        }

        // Initial Render
        renderCard();
    </script>
