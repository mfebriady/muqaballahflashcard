<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Muqabalah Flashcards</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #16a085;
            --bg: #ecf0f1;
            --card-bg: #ffffff;
            --text: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        select, button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: var(--primary);
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }

        select {
            background-color: white;
            color: var(--text);
            border: 2px solid var(--primary);
        }

        button:hover {
            background-color: var(--secondary);
        }

        /* Flashcard Container */
        .card-container {
            width: 90%;
            max-width: 550px;
            height: 350px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 15px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            background: var(--card-bg);
            text-align: center;
        }

        .card-front {
            border-top: 8px solid var(--primary);
        }

        .card-back {
            transform: rotateY(180deg);
            border-top: 8px solid var(--secondary);
            background-color: #f9fbfb;
        }

        .side-indicator {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
        }

        .arabic-text {
            font-family: 'Traditional Arabic', 'Amiri', 'Cairo', serif;
            font-size: 28px;
            font-weight: bold;
            direction: rtl;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .translation-text {
            font-size: 16px;
            color: #555;
            line-height: 1.4;
            font-style: italic;
        }

        .progress {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h2>Latihan Muqabalah Flashcards</h2>
        <p>Klik kartu untuk membalik, gunakan tombol untuk navigasi.</p>
    </header>

    <div class="controls">
        <label for="langSelect">Bahasa Terjemahan: </label>
        <select id="langSelect" onchange="changeLanguage()">
            <option value="id">Indonesia</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="flashcard">
            <!-- Front Face -->
            <div class="card-face card-front">
                <span class="side-indicator">Pertanyaan / Syaikh</span>
                <div class="arabic-text" id="front-arabic"></div>
                <div class="translation-text" id="front-trans"></div>
            </div>
            <!-- Back Face -->
            <div class="card-face card-back">
                <span class="side-indicator">Jawaban Anda</span>
                <div class="arabic-text" id="back-arabic"></div>
                <div class="translation-text" id="back-trans"></div>
            </div>
        </div>
    </div>

    <div class="progress" id="progress-text">Kartu 1 dari 25</div>

    <div class="controls" style="margin-top: 20px;">
        <button onclick="prevCard(event)">◄ Sebelumnya</button>
        <button onclick="randomCard(event)">Acak 🎲</button>
        <button onclick="nextCard(event)">Selanjutnya ►</button>
    </div>

        let currentIndex = 0;
        let currentLang = 'id';
        const cardEl = document.getElementById('flashcard');

        function updateCard() {
            cardEl.classList.remove('flipped');
            setTimeout(() => {
                const item = flashcardsData[currentIndex];
                document.getElementById('front-arabic').innerText = item.front.ar;
                document.getElementById('front-trans').innerText = item.front[currentLang];
                
                document.getElementById('back-arabic').innerText = item.back.ar;
                document.getElementById('back-trans').innerText = item.back[currentLang];
                
                document.getElementById('progress-text').innerText = `Kartu ${currentIndex + 1} dari ${flashcardsData.length}`;
            }, 150);
        }

        function flipCard() {
            cardEl.classList.toggle('flipped');
        }

        function nextCard(event) {
            event.stopPropagation();
            currentIndex = (currentIndex + 1) % flashcardsData.length;
            updateCard();
        }

        function prevCard(event) {
            event.stopPropagation();
            currentIndex = (currentIndex - 1 + flashcardsData.length) % flashcardsData.length;
            updateCard();
        }

        function randomCard(event) {
            event.stopPropagation();
            currentIndex = Math.floor(Math.random() * flashcardsData.length);
            updateCard();
        }

        function changeLanguage() {
            currentLang = document.getElementById('langSelect').value;
            const frontInd = document.querySelector('.card-front .side-indicator');
            const backInd = document.querySelector('.card-back .side-indicator');
            if(currentLang === 'en') {
                frontInd.innerText = "Question / Sheikh";
                backInd.innerText = "Your Answer";
            } else {
                frontInd.innerText = "Pertanyaan / Syaikh";
                backInd.innerText = "Jawaban Anda";
            }
            updateCard();
        }

        updateCard();
    </script>
</body>
</html>
